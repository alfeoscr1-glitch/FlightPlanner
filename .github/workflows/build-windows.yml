name: Build Windows EXE
on:
  push:
    paths: ['index.html']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Neutralino CLI
        run: |
          Invoke-WebRequest -Uri "https://github.com/neutralinojs/neutralino-cli/releases/latest/download/neu-win-x64.exe" -OutFile "neu.exe"

      - name: Initialize Neutralino project
        run: .\neu.exe init --force --template=window

      - name: Replace default index.html
        run: Copy-Item index.html app/index.html -Force

      - name: Configure app settings
        run: |
          $config = Get-Content "app/neutralino.config.json" -Raw | ConvertFrom-Json
          $config.cli.binaryName = "LittleNavmapFlightPlanner"
          $config.application.title = "Little Navmap Flight Planner"
          $config.application.width = 1000
          $config.application.height = 800
          $config.application.resizable = $true
          $config.application.mode = "window"
          $config.application.extendUserAgent = "FlightPlanner/1.0"
          $config | ConvertTo-Json -Depth 10 | Set-Content "app/neutralino.config.json"

      - name: Build standalone Windows EXE
        run: .\neu.exe build --release

      - name: Package into ZIP
        run: Compress-Archive -Path "dist/LittleNavmapFlightPlanner/*" -DestinationPath "FlightPlanner-Windows.zip"

      - name: Upload finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: FlightPlanner-Windows
          path: FlightPlanner-Windows.zip
          retention-days: 90
