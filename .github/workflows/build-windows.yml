name: Build Flight Planner EXE
run-name: Building Windows EXE 🚀
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get your code
        uses: actions/checkout@v4

      - name: Download html-exe builder
        run: |
          Invoke-WebRequest -Uri "https://github.com/michal-kokoska/html-exe/releases/download/v1.2.0/html-exe.exe" -OutFile "html-exe.exe"

      - name: Build EXE from your HTML
        run: .\html-exe.exe --input index.html --output LittleNavmapFlightPlanner.exe --title "Little Navmap Flight Planner" --width 1050 --height 850

      - name: Package into ZIP
        run: Compress-Archive -Path "LittleNavmapFlightPlanner.exe" -DestinationPath "LittleNavmapFlightPlanner-Windows.zip"

      - name: ✅ Download Your Finished App
        uses: actions/upload-artifact@v4
        with:
          name: LittleNavmapFlightPlanner
          path: LittleNavmapFlightPlanner-Windows.zip
          retention-days: 90
