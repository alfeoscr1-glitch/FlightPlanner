name: Build Flight Planner EXE
run-name: Building Windows EXE 🚀
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get your code
        uses: actions/checkout@v4

      - name: Install Neutralino CLI via NPM
        shell: pwsh
        run: |
          npm install -g @neutralinojs/neutralinojs-cli

      - name: Verify CLI installed
        run: neu --version

      - name: Setup Project
        run: |
          neu init --force --template=window
          Copy-Item index.html app/index.html -Force

      - name: Configure App Settings
        shell: pwsh
        run: |
          $json = Get-Content "app/neutralino.config.json" -Raw | ConvertFrom-Json
          $json.cli.binaryName = "LittleNavmapFlightPlanner"
          $json.application.title = "Little Navmap Flight Planner"
          $json.application.width = 1050
          $json.application.height = 850
          $json.application.resizable = $true
          $json.application.mode = "window"
          $json.application.enableInspector = $false
          $json | ConvertTo-Json -Depth 10 | Set-Content "app/neutralino.config.json"

      - name: Build Standalone EXE
        run: neu build --release

      - name: Package Everything
        run: |
          New-Item -ItemType Directory -Path "package" -Force | Out-Null
          Copy-Item "dist\LittleNavmapFlightPlanner\LittleNavmapFlightPlanner.exe" "package\"
          Copy-Item "dist\LittleNavmapFlightPlanner\resources.neu" "package\"
          Compress-Archive -Path "package\*" -DestinationPath "LittleNavmapFlightPlanner-Windows.zip"

      - name: ✅ Download Your EXE Here
        uses: actions/upload-artifact@v4
        with:
          name: LittleNavmapFlightPlanner
          path: LittleNavmapFlightPlanner-Windows.zip
          retention-days: 90
